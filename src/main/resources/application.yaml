
spring:
  application:
    name: portfolioService
  datasource:
    url: jdbc:postgresql://portfolio-service-db:5432/portfolioService
    username: user
    password: postgres
  data:
    redis:
      password: admin
      host: my-redis
      port: 6379
      type: redis
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/ChainTracker
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  jpa:
    # Desligado: a lista de posicoes saiu do Portfolio, entao nao ha lazy loading
    # fora da transacao para segurar a sessao aberta.
    open-in-view: false
    hibernate:
      # O schema e responsabilidade das migrations em db/migration. O Hibernate
      # so confere no boot se as entidades batem com o banco; quem divergir falha
      # aqui, alto, em vez de ser ajustado em silencio.
      ddl-auto: validate
  flyway:
    # O banco de dev ja existia quando o Flyway entrou (criado pelo ddl-auto),
    # entao ele nao tem flyway_schema_history. O baseline adota esse banco na
    # versao 1 sem reexecutar a V1 (que criaria tabelas ja existentes) e deixa
    # a V2 rodar para corrigir o schema legado. Em banco vazio nada disso
    # acontece: as migrations rodam normalmente desde a V1.
    baseline-on-migrate: true
    baseline-version: 1
    enabled: true
server:
  port: 8087